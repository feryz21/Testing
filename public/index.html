<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Gambar Dynamic QR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f4f4f9; padding: 20px; }
    .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 480px; width: 100%; text-align: center; }
    img { max-width: 100%; height: auto; border-radius: 12px; margin-top: 15px; }
    .admin-panel { margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; text-align: left; }
    input[type="file"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px dashed #007bff; border-radius: 8px; background: #f8f9fa; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 5px; }
    button:disabled { background: #aaa; }
    .hidden { display: none; }
    .status { margin-top: 12px; font-size: 14px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Menu Hari Ini</h2>
    <div id="loading">Memuat gambar...</div>
    <img id="displayImage" src="" alt="Gambar QR" class="hidden">

    <!-- Panel Admin: Muncul hanya jika ada parameter ?admin=true -->
    <div id="adminPanel" class="admin-panel hidden">
      <h3>Panel Admin</h3>
      <p style="font-size: 13px; color: #666; margin-top: 4px;">Pilih foto dari galeri HP kamu:</p>
      
      <input type="file" id="fileInput" accept="image/*">
      <button id="uploadBtn" onclick="uploadImage()">Upload & Simpan Gambar</button>
      <p id="statusMsg" class="status"></p>
    </div>
  </div>

  <script>
    async function fetchImage() {
      try {
        const res = await fetch('/api/image');
        const data = await res.json();
        const imgEl = document.getElementById('displayImage');
        imgEl.src = data.imageUrl;
        imgEl.classList.remove('hidden');
        document.getElementById('loading').classList.add('hidden');
      } catch (err) {
        document.getElementById('loading').innerText = 'Gagal memuat gambar.';
      }
    }

    async function uploadImage() {
      const fileInput = document.getElementById('fileInput');
      const statusMsg = document.getElementById('statusMsg');
      const btn = document.getElementById('uploadBtn');

      if (fileInput.files.length === 0) return alert('Silakan pilih foto dari HP terlebih dahulu!');

      const formData = new FormData();
      formData.append('image', fileInput.files[0]);

      btn.disabled = true;
      btn.innerText = 'Mengunggah...';
      statusMsg.style.color = '#007bff';
      statusMsg.innerText = 'Prosedur upload ke server sedang berjalan...';

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.success) {
          statusMsg.style.color = 'green';
          statusMsg.innerText = '✅ Gambar berhasil diperbarui secara permanen!';
          fileInput.value = '';
          fetchImage();
        } else {
          statusMsg.style.color = 'red';
          statusMsg.innerText = '❌ Gagal: ' + (data.error || 'Terjadi kesalahan');
        }
      } catch (err) {
        statusMsg.style.color = 'red';
        statusMsg.innerText = '❌ Terjadi kesalahan jaringan.';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Upload & Simpan Gambar';
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') {
      document.getElementById('adminPanel').classList.remove('hidden');
    }

    fetchImage();
  </script>
</body>
</html>

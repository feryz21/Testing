<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Hari Ini</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    img { width: 100%; height: auto; border-radius: 8px; margin-bottom: 15px; min-height: 200px; background: #eee; object-fit: cover; }
    .admin-panel { border-top: 1px solid #eee; margin-top: 20px; padding-top: 15px; }
    button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    .message { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Menu Hari Ini</h2>
    <img id="menuImage" src="" alt="Gambar Menu" />

    <div id="adminArea" class="admin-panel" style="display: none;">
      <h3>Panel Admin</h3>
      <input type="file" id="fileInput" accept="image/*" />
      <button onclick="uploadImage()">Upload & Simpan Gambar</button>
      <div id="statusMsg" class="message"></div>
    </div>
  </div>

  <script>
    // Fungsi untuk memuat gambar dengan Cache Buster
    async function loadImage() {
      try {
        const res = await fetch('/api/image');
        const data = await res.json();
        if (data.imageUrl) {
          // Tambahkan timestamp ?t= untuk menghindari cache browser
          const cacheBusterUrl = data.imageUrl + (data.imageUrl.includes('?') ? '&t=' : '?t=') + new Date().getTime();
          document.getElementById('menuImage').src = cacheBusterUrl;
        }
      } catch (err) {
        console.error('Gagal memuat gambar:', err);
      }
    }

    // Fungsi upload dari HP Admin
    async function uploadImage() {
      const fileInput = document.getElementById('fileInput');
      const statusMsg = document.getElementById('statusMsg');

      if (!fileInput.files[0]) {
        alert('Pilih file gambar terlebih dahulu!');
        return;
      }

      statusMsg.style.color = 'black';
      statusMsg.innerText = 'Mengunggah... Mohon tunggu.';

      const formData = new FormData();
      formData.append('image', fileInput.files[0]);

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        const result = await res.json();

        if (result.success) {
          statusMsg.style.color = 'green';
          statusMsg.innerText = '✅ Gambar berhasil diperbarui secara permanen!';
          
          // Langsung ganti src gambar di layar admin dengan timestamp baru
          const newUrl = result.imageUrl + (result.imageUrl.includes('?') ? '&t=' : '?t=') + new Date().getTime();
          document.getElementById('menuImage').src = newUrl;
          fileInput.value = ''; // Clear file input
        } else {
          throw new Error(result.error);
        }
      } catch (err) {
        statusMsg.style.color = 'red';
        statusMsg.innerText = '❌ Gagal mengunggah gambar.';
      }
    }

    // Tampilkan panel admin jika URL memiliki query ?admin=true
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') {
      document.getElementById('adminArea').style.display = 'block';
    }

    // Jalankan saat halaman dibuka
    loadImage();
  </script>
</body>
</html>
